name: Lint, Build & Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build:worker

  deploy:
    # Deploy only on pushes to main (not on PRs).
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the OpenNext worker and deploys via wrangler.
      # Requires repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit)
      # and CLOUDFLARE_ACCOUNT_ID — see README "Deployment" section.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm deploy:worker
      # Apply D1 migrations to the production database after deploy.
      # Enable this once a real D1 database exists: create it in the
      # Cloudflare dashboard, replace database_id in wrangler.toml, then
      # uncomment (the same API token needs D1: Edit permission):
      # - name: Apply D1 migrations
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      #   run: pnpm db:migrate:remote
