# Cloudflare Workers configuration for the OpenNext adapter.
# See: https://opennext.js.org/cloudflare
name = "nextjs-starter"
main = ".open-next/worker.js"

compatibility_date = "2024-09-23"
# nodejs_compat: Node.js APIs (Buffer, node:stream for @react-email/render, ...)
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

# D1 (SQLite) — reserved for upcoming business data (users / conversations
# when the login + AI chat feature ships). All v1 tables were removed.
# Local dev uses preview_database_id (no login / real id required).
# For production: create the database in the Cloudflare dashboard and
# replace database_id with the real UUID, then run `pnpm db:migrate:remote`.
[[d1_databases]]
binding = "DB"
database_name = "nextjs-starter"
database_id = "00000000-0000-0000-0000-000000000000"
preview_database_id = "local-db"

# R2 (object storage) — download assets (trial builds, press kit, docs),
# served via /api/download/... For production: create the bucket in the
# Cloudflare dashboard first; local dev uses automatic emulation.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "nextjs-starter-assets"

# Workers AI — the emotional-companion chat model. In production the worker
# runs against the real Workers AI API automatically; local `wrangler dev`
# uses workerd's local inference. (`remote = true` would force the real API
# in local dev but requires Cloudflare credentials at build time, which
# breaks CI — add it back only for credentialed local testing.)
# Model override via AI_MODEL env.
[ai]
binding = "AI"

