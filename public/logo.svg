<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- SerenAI — minimal line, soft glow, frosted glass -->
  <defs>
    <linearGradient id="seren-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.55" stop-color="#fafbff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="seren-stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="seren-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="seren-frost" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- frosted base -->
  <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#seren-bg)"/>
  <rect x="5" y="5" width="110" height="110" rx="29" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>
  <ellipse cx="44" cy="28" rx="34" ry="16" fill="#ffffff" fill-opacity="0.5" filter="url(#seren-frost)"/>

  <!-- minimal breath/wave line with glow -->
  <path d="M18 64 C 32 46, 50 80, 64 61 S 86 45, 102 56"
        stroke="url(#seren-stroke)" stroke-width="6.5" stroke-linecap="round"
        filter="url(#seren-glow)"/>
  <!-- echo line -->
  <path d="M18 72 C 32 56, 50 86, 64 69 S 86 55, 102 64"
        stroke="url(#seren-stroke)" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>

  <!-- sparkle -->
  <circle cx="88" cy="30" r="3.2" fill="#a78bfa" opacity="0.9"/>
  <circle cx="88" cy="30" r="7" fill="#a78bfa" opacity="0.18" filter="url(#seren-frost)"/>
</svg>
